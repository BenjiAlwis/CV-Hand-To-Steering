<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foot Detector</title>
<link rel="icon" href="/assets/icon.svg">
<style>
  :root{--ink:#e8ecf2;--dim:#7c8798;--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  body{margin:0;background:#070a0e;color:var(--ink);
       font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
       display:grid;place-items:center;min-height:100vh;padding:20px;gap:14px}
  h1{font-size:11px;letter-spacing:.3em;color:var(--dim);font-weight:500;margin:0;text-transform:uppercase}
  .stage{position:relative;width:min(900px,94vw);aspect-ratio:16/9;background:#0b0f14;
         border:1px solid var(--line);border-radius:10px;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{transform:scaleX(-1)}
  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;
       width:min(900px,94vw)}
  button,select,label{font:inherit;font-size:11px}
  button,select{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);
                border-bottom-width:2px;border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover,select:hover{background:rgba(255,255,255,.13)}
  label{color:var(--dim);display:flex;align-items:center;gap:5px;cursor:pointer}
  .out{width:min(900px,94vw);color:var(--dim);font-size:11px;white-space:pre-wrap;min-height:44px}
  .err{color:#ff6a5a}
</style>
</head>
<body>
  <h1>Foot detector — second camera</h1>
  <div class="stage">
    <video id="feed" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="bar">
    <select id="camera"></select>
    <select id="model">
      <option value="multiclass">multiclass · body-skin</option>
      <option value="deeplab">deeplab · person</option>
    </select>
    <label><input type="checkbox" id="socks"> socks / shoes</label>
    <label><input type="checkbox" id="showMask" checked> show mask</label>
    <button id="start" type="button">Start</button>
  </div>
  <div class="out" id="out">pick a camera and press start</div>

  <script type="importmap">
    { "imports": { "@mediapipe/tasks-vision": "/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs" } }
  </script>
  <script type="module" src="./src/vision/footpreview.js"></script>
</body>
</html>
